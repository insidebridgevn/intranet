<style>
  html, body { margin: 0; height: 100%; background: #FFF5EE; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; z-index: 1; }
  .wait { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
          font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; color: #9C8376; z-index: 0; text-align: center; padding: 16px; }
  .wait img { width: 72px; height: 72px; }
  .wait a { color: #C24E18; font-weight: 600; }
  @media (prefers-color-scheme: dark) { html, body { background: #1B1512; } .wait { color: #B9A397; } .wait a { color: #FF9A62; } }
</style>

<body>
<div class="wait">
  <img src="favicon.svg" alt="">
  <span id="msg">Đang mở IBVN Intranet… Không thấy gì? <a id="direct" href="#">Bấm vào đây</a></span>
</div>
<iframe id="app" title="IBVN Intranet" allow="clipboard-write; camera"></iframe>
<script>
  // DÁN LINK /exec CỦA INTRANET (Apps Script) VÀO GIỮA HAI DẤU NHÁY:
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwRCkI2b6f73-SvMi0ljSs0hQ1i7WqyXDBXEtlq3KygnxKbcBQcEmtrMllFl-kvo4IjXA/exec';

  if (EXEC_URL.indexOf('script.google.com') < 0) {
    document.getElementById('msg').textContent = 'Chưa dán link /exec của intranet vào file index.html (dòng EXEC_URL).';
    document.getElementById('app').style.display = 'none';
  } else {
    // Giữ phần ?page=…&code=… của link (vd link trong email mở thẳng 1 đơn cần duyệt)
    var src = EXEC_URL + (location.search || '');
    document.getElementById('app').src = src;
    document.getElementById('direct').href = src;
  }
</script>
</body>
