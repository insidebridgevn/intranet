<style>
/* Layout: floating glass sidebar + glass topbar over a warm peach mesh; home is a 12-col bento with a right rail */
:root{
  --bg:#FFF5EE; --surface:#FFFFFF; --surface-2:#FFF8F3; --surface-3:#FFEEE3;
  --glass:rgba(255,255,255,.74); --glass-2:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.95);
  --line:#F6E4D8; --line-2:#ECD3C2;
  --text:#2A1810; --text-2:#5F473B; --muted:#9C8376;
  --brand:#FF8A4C; --brand-strong:#F2692E; --brand-ink:#C24E18; --brand-soft:#FFE2D0; --brand-tint:#FFF2E9;
  --g1:#FFC6A1; --g2:#FF9A5E; --g3:#F2632C;
  --grad:linear-gradient(135deg,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);
  --mesh-a:#FFDCC6; --mesh-b:#FFE5EE; --mesh-c:#FFF0D6;
  --ok:#23946A; --ok-bg:#E1F5EB; --warn:#B57509; --warn-bg:#FFF2D2; --bad:#D2433D; --bad-bg:#FDE9E8; --info:#3770CF; --info-bg:#E6EFFD;
  --h-peach:#FFE2D0; --h-peach-i:#E0622A; --h-rose:#FFE1E8; --h-rose-i:#D2416A; --h-sand:#FFF0C8; --h-sand-i:#AD7A06;
  --h-mint:#DBF4E8; --h-mint-i:#23946A; --h-sky:#E1EDFF; --h-sky-i:#3770CF; --h-lilac:#ECE5FF; --h-lilac-i:#7550D2;
  --shadow-sm:0 1px 2px rgba(140,60,20,.06);
  --shadow:0 1px 2px rgba(140,60,20,.05),0 14px 34px -16px rgba(205,95,35,.28);
  --shadow-lg:0 30px 70px -24px rgba(170,70,20,.38);
  --glow:0 10px 26px -10px rgba(255,110,50,.75);
  --r:22px; --r-sm:12px; --sbw:292px;
  --fd:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --fb:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140E0B; --surface:#1F1712; --surface-2:#261C16; --surface-3:#30231B;
    --glass:rgba(34,25,20,.72); --glass-2:rgba(34,25,20,.5); --glass-line:rgba(255,200,170,.08);
    --line:#33261E; --line-2:#45342A; --text:#FBEFE7; --text-2:#DCC7BA; --muted:#A99285;
    --brand:#FF9A62; --brand-strong:#FFAD7D; --brand-ink:#FFC4A0; --brand-soft:#4A2A1A; --brand-tint:#2B1D16;
    --mesh-a:#3A2116; --mesh-b:#331B22; --mesh-c:#2E2214;
    --ok:#5ACB98; --ok-bg:#183327; --warn:#E8B54F; --warn-bg:#382B12; --bad:#F27C75; --bad-bg:#3B1B19; --info:#82AEF5; --info-bg:#1A2A42;
    --h-peach:#4A2A1A; --h-peach-i:#FFAD7D; --h-rose:#4A1F2C; --h-rose-i:#FF8FAE; --h-sand:#443414; --h-sand-i:#F0C35A;
    --h-mint:#173A2B; --h-mint-i:#6BD6A5; --h-sky:#1B2C46; --h-sky-i:#8DB5F7; --h-lilac:#2C2346; --h-lilac-i:#B49CFA;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -16px rgba(0,0,0,.6); --shadow-lg:0 30px 70px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140E0B; --surface:#1F1712; --surface-2:#261C16; --surface-3:#30231B;
  --glass:rgba(34,25,20,.72); --glass-2:rgba(34,25,20,.5); --glass-line:rgba(255,200,170,.08);
  --line:#33261E; --line-2:#45342A; --text:#FBEFE7; --text-2:#DCC7BA; --muted:#A99285;
  --brand:#FF9A62; --brand-strong:#FFAD7D; --brand-ink:#FFC4A0; --brand-soft:#4A2A1A; --brand-tint:#2B1D16;
  --mesh-a:#3A2116; --mesh-b:#331B22; --mesh-c:#2E2214;
  --ok:#5ACB98; --ok-bg:#183327; --warn:#E8B54F; --warn-bg:#382B12; --bad:#F27C75; --bad-bg:#3B1B19; --info:#82AEF5; --info-bg:#1A2A42;
  --h-peach:#4A2A1A; --h-peach-i:#FFAD7D; --h-rose:#4A1F2C; --h-rose-i:#FF8FAE; --h-sand:#443414; --h-sand-i:#F0C35A;
  --h-mint:#173A2B; --h-mint-i:#6BD6A5; --h-sky:#1B2C46; --h-sky-i:#8DB5F7; --h-lilac:#2C2346; --h-lilac-i:#B49CFA;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -16px rgba(0,0,0,.6); --shadow-lg:0 30px 70px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 var(--fb);}
body.lang-ko{font-family:'Noto Sans KR',var(--fb)}
body{-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 620px at -5% -10%,var(--mesh-a) 0%,transparent 60%),radial-gradient(760px 520px at 105% 0%,var(--mesh-b) 0%,transparent 58%),radial-gradient(1000px 700px at 55% 115%,var(--mesh-c) 0%,transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-ink)}
h1,h2,h3,h4{font-family:var(--fd);text-wrap:balance}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--brand-soft)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono,.tnum{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.06)}}
@keyframes sk{to{background-position:-200% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,120,60,.5)}100%{box-shadow:0 0 0 10px rgba(255,120,60,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;position:relative;overflow:hidden}
.auth-hero{position:relative;padding:48px max(32px,5vw);display:flex;flex-direction:column;justify-content:space-between;gap:32px;color:#fff;background:var(--grad);overflow:hidden;isolation:isolate}
.auth-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(500px 400px at 85% 15%,rgba(255,255,255,.35),transparent 60%),radial-gradient(600px 500px at 10% 100%,rgba(255,80,20,.35),transparent 60%)}
.auth-hero .ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);z-index:-1}
.auth-hero .ring.a{width:520px;height:520px;right:-160px;top:-160px}
.auth-hero .ring.b{width:340px;height:340px;right:-70px;top:-70px}
.auth-hero .ring.c{width:700px;height:700px;left:-320px;bottom:-420px}
.brandline{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.08em;font-size:12.5px}
.brandline .logo{background:#fff;color:var(--g3);box-shadow:0 8px 20px -8px rgba(120,40,0,.5)}
.auth-hero h1{font-size:clamp(34px,4.2vw,56px);line-height:1.04;margin:0;font-weight:700;letter-spacing:-.025em}
.auth-hero h1 em{font-style:normal;background:rgba(255,255,255,.22);padding:0 .18em;border-radius:.2em}
.auth-hero p.lead{margin:16px 0 0;font-size:16px;opacity:.92;max-width:44ch}
.float-zone{position:relative;height:250px}
.fcard{position:absolute;background:rgba(255,255,255,.9);color:var(--text);border-radius:18px;padding:14px 16px;box-shadow:0 24px 50px -20px rgba(120,40,0,.55);display:flex;gap:12px;align-items:center;min-width:220px;animation:float 6s ease-in-out infinite;backdrop-filter:blur(8px)}
.fcard .fi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.fcard b{display:block;font-size:13.5px}
.fcard span{font-size:12px;color:var(--muted)}
.fcard.a{left:0;top:10px}
.fcard.b{left:min(42%,260px);top:90px;animation-delay:-2s}
.fcard.c{left:8%;top:170px;animation-delay:-4s}
.auth-side{display:grid;place-items:center;padding:40px 24px;position:relative}
.auth-form{width:min(420px,100%);display:flex;flex-direction:column;gap:16px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.auth-form h2{margin:0;font-size:32px;letter-spacing:-.02em}
.auth-form .sub{color:var(--muted);margin:-6px 0 8px}
.hint{font-size:12.5px;color:var(--text-2);background:var(--glass);border:1px solid var(--line);padding:12px 14px;border-radius:14px}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-hero{padding:28px 20px;gap:18px}.float-zone{display:none}.auth-hero h1{font-size:32px}.auth-side{padding:28px 16px 40px}}

.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:15px;background:var(--grad);color:#fff;flex:none;overflow:hidden;box-shadow:var(--glow)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}

/* ---------- Controls ---------- */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field .req{color:var(--brand-strong)}
.input,.select,.textarea{width:100%;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:11px 13px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.textarea{min-height:96px;resize:vertical}
.input:hover,.select:hover,.textarea:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line-2))}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.input[readonly]{background:var(--surface-2);color:var(--text-2)}
.input.lg{padding:14px 16px;font-size:15px;border-radius:14px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:46px}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:6px;cursor:pointer;border-radius:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.check input{accent-color:var(--brand);width:16px;height:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-sm);padding:10px 15px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--text);transition:background .15s,transform .12s,box-shadow .15s,filter .15s;white-space:nowrap;text-decoration:none;font-size:13.5px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{filter:saturate(1.15) brightness(1.03)}
.btn.ghost{background:var(--glass);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.lg{padding:14px 20px;font-size:15px;border-radius:14px}
.btn.block{width:100%}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--text-2);position:relative;transition:background .15s,color .15s,transform .12s}
.icon-btn:hover{color:var(--brand-ink);transform:translateY(-1px)}
.dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--grad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);animation:pulse 1.8s infinite}
.dot[hidden]{display:none}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .28s cubic-bezier(.2,.8,.2,1)}
.app.collapsed{--sbw:100px}
.sb{position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-line);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:30}
.sb-top{display:flex;align-items:center;gap:11px;padding:18px 18px 12px}
.sb-top .name{font-family:var(--fd);font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;line-height:1.1}
.sb-top .name span{display:block;font-family:var(--fb);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.me{position:relative;overflow:hidden;margin:6px 14px 8px;padding:16px;border-radius:20px;background:var(--grad);color:#fff;display:flex;gap:12px;align-items:center;box-shadow:var(--glow);isolation:isolate}
.me::before,.me::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.18);z-index:-1}
.me::before{width:140px;height:140px;right:-40px;top:-60px}
.me::after{width:90px;height:90px;left:-30px;bottom:-50px;background:rgba(255,255,255,.12)}
.avatar{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--g3);display:grid;place-items:center;font-family:var(--fd);font-weight:800;flex:none;font-size:15px;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.avatar.sm{width:38px;height:38px;font-size:13px;background:var(--grad);color:#fff;box-shadow:none}
.me .who{min-width:0;flex:1}
.me .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{display:block;font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who .id{display:inline-block;margin:3px 0 2px;background:rgba(255,255,255,.24);padding:1px 8px;border-radius:999px;font-weight:600;font-size:11px;letter-spacing:.03em}
.me .gear{width:34px;height:34px;border-radius:11px;border:0;background:rgba(255,255,255,.24);display:grid;place-items:center;cursor:pointer;color:#fff;flex:none;transition:background .15s,transform .3s}
.me .gear:hover{background:rgba(255,255,255,.38);transform:rotate(60deg)}
.nav{flex:1;overflow:auto;padding:4px 14px 12px;scrollbar-width:thin}
.nav h6{margin:16px 12px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--text-2);text-decoration:none;font-weight:500;cursor:pointer;position:relative;white-space:nowrap;transition:background .15s,color .15s,transform .15s}
.nav a:hover{background:var(--surface);color:var(--text)}
@media (hover:hover){.nav a:hover{transform:translateX(2px)}}
.nav a.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:var(--glow)}
.nav a .badge{margin-left:auto;background:var(--grad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
.nav a.on .badge{background:rgba(255,255,255,.3)}
.nav a .lock{margin-left:auto;color:var(--muted)}
.nav a .lock svg{width:14px;height:14px}
.badge-dot{display:none;position:absolute;top:7px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.sb-foot{padding:12px 14px 16px}
.sb-foot a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap;border:1px dashed var(--line-2)}
.sb-foot a:hover{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.app.collapsed .lbl,.app.collapsed .nav h6,.app.collapsed .me .who,.app.collapsed .me .gear,.app.collapsed .sb-top .name,.app.collapsed .nav a .badge,.app.collapsed .nav a .lock{display:none}
.app.collapsed .me{padding:10px;justify-content:center;margin-inline:16px}
.app.collapsed .nav a,.app.collapsed .sb-foot a{justify-content:center}
.app.collapsed .nav a .badge-dot{display:block}
.app.collapsed .nav h6{display:block;height:1px;margin:12px 16px;background:var(--line-2);font-size:0}
.app.collapsed .sb-top{justify-content:center;padding-inline:0}

.main{min-width:0;display:flex;flex-direction:column;padding:12px 12px 0 18px}
.top{position:sticky;top:12px;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-line);border-radius:20px;box-shadow:var(--shadow-sm)}
.top .ttl{min-width:0;flex:1}
.top .crumb{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 14px;min-width:260px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.search:hover{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.search span{flex:1;text-align:left}
kbd{font:600 11px var(--fb);background:var(--surface-3);color:var(--text-2);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:7px;padding:2px 7px}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:0 6px}
.clock b{font-family:var(--fd);font-size:17px;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;color:var(--muted)}
.me-btn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.page{padding:22px 4px 40px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.page>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 4px 20px}

/* ---------- Rooms week grid ---------- */

.wk-col{position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(180deg,transparent 0 43px,var(--line) 43px 44px);cursor:copy}

.wk-ev{position:absolute;left:4px;right:4px;border-radius:11px;padding:5px 8px;font-size:11.5px;overflow:hidden;background:var(--h-sky);color:var(--h-sky-i);border-left:3px solid var(--h-sky-i);cursor:default;z-index:1}

/* ---------- Requests ---------- */

.rich b,.rich strong{font-weight:700}.rich ul,.rich ol{margin:6px 0;padding-left:22px}.rich p{margin:0 0 6px}.rich a{color:var(--brand-ink);text-decoration:underline}

function modal(title, bodyHtml, actions){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">
    <div class="card-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Đóng">${ic('x')}</button></div>
    <div class="card-b">${bodyHtml}</div>
    <div class="modal-f">${actions||''}</div></div></div>`;
  const close = () => root.innerHTML = '';
  root.querySelector('.modal-bg').addEventListener('click', e => { if (e.target.classList.contains('modal-bg') || e.target.closest('[data-close]')) close(); });
  return { el: root.querySelector('.modal'), close };
}

function busy(btn, on, label){
  if (!btn) return;
  if (on) { btn.dataset.html = btn.innerHTML; btn.disabled = true; btn.innerHTML = label || 'Đang xử lý…'; }
  else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
}

function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(){ const t = store.get('ibvn_theme2'); if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'; }
applyTheme();

/* ---------- Xem với tư cách (admin) ---------- */
async function startImp(id, btn){
  if (btn) busy(btn, true, '…');
  try {
    const r = await call('adm.impersonate', { id });
    store.set('ibvn_token_admin', S.token);
    store.set('ibvn_token', r.token);
    location.hash = 'home'; location.reload();
  } catch(err) { toast(err.message, 'err'); if (btn) busy(btn, false); }
}
async function stopImp(){
  try { await call('logout', { token:S.token }); } catch(e){}   // huỷ luôn phiên xem trên máy chủ
  const back = store.get('ibvn_token_admin');
  store.del('ibvn_token_admin');
  if (back) store.set('ibvn_token', back); else store.del('ibvn_token');
  location.hash = 'admin'; location.reload();
}
function impBanner(){
  let b = document.getElementById('imp-bar');
  if (!(S.user && S.user.imp)) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'imp-bar'; document.body.appendChild(b); }
  b.innerHTML = `${ic('eye')}<span>Đang xem với tư cách <b>${esc(S.user.name)}</b> · ${esc(S.user.id)} — chỉ xem, không thay đổi được</span><button class="btn sm white" id="imp-x">Thoát</button>`;
  b.querySelector('#imp-x').onclick = stopImp;
}

/* ---------- Boot ---------- */
async function boot(){
  S.token = store.get('ibvn_token');
  const startPage = await getStartPage();
  if (startPage && PAGE[startPage]) S.page = startPage;
  let fast = null; try { fast = JSON.parse(store.get('ibvn_me1') || 'null'); } catch(e) {}
  if (S.token && fast && fast.tk === S.token && fast.d && fast.d.user && Date.now() - fast.t < 7 * 864e5) {
    // mở lại web: dùng thông tin lần trước để vào thẳng trang, kiểm tra phiên ngầm phía sau
    S.user = fast.d.user; S.links = fast.d.links;
    render(); impBanner(); bootNav();
    call('me').then(d => { const was = JSON.stringify({ u:S.user, l:S.links }); S.user = d.user; S.links = d.links; meSave(d);
      if (JSON.stringify({ u:S.user, l:S.links }) !== was) {   // thông tin tài khoản có thay đổi (hợp đồng, quyền, ảnh…) → vẽ lại, trừ khi đang gõ / mở hộp thoại
        const ae = document.activeElement, busyNow = (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) || ($('#modal-root') && $('#modal-root').innerHTML.trim());
        if (S.user.mustChange || !busyNow) { const y = window.scrollY; render(); impBanner(); requestAnimationFrame(() => window.scrollTo(0, y)); } else { renderNav(); impBanner(); } } }).catch(() => {});
    return;
  }
  if (S.token) {
    try { const d = await call('me'); S.user = d.user; S.links = d.links; meSave(d); }
    catch(e) {
      S.token = null; store.del('ibvn_token');
      const back = store.get('ibvn_token_admin');   // phiên xem với tư cách hết hạn → quay về tài khoản admin
      if (back) { store.del('ibvn_token_admin'); store.set('ibvn_token', back); S.token = back; try { const d = await call('me'); S.user = d.user; S.links = d.links; } catch(e2) { S.token = null; store.del('ibvn_token'); } }
    }
  }
  render(); impBanner(); bootNav();
}
const meSave = d => { try { localStorage.setItem('ibvn_me1', JSON.stringify({ tk:S.token, t:Date.now(), d })); } catch(e) { store.del('ibvn_me1'); } };
function bootNav(){
  if (IS_GAS && google.script.history) google.script.history.setChangeHandler(e => { const p = e.location.parameter.page; if (p && PAGE[p] && p !== S.page) go(p, true); });
  window.addEventListener('hashchange', () => { if (IS_GAS) return; const p = location.hash.slice(1); if (p && PAGE[p] && p !== S.page) go(p, true); });
}
function getStartPage(){
  return new Promise(res => {
    if (IS_GAS && google.script.url) google.script.url.getLocation(l => { S.startCode = l.parameter.code || ''; res(l.parameter.page); });
    else {
      let q; try { q = new URLSearchParams(location.search); } catch(e) { q = null; }
      S.startCode = (q && q.get('code')) || ''; S.startAnn = (q && q.get('id')) || '';
      res(location.hash.slice(1) || (q && q.get('page')) || '');
    }
  });
}

function render(){
  BOOTED = true; window.__BOOTED = true; document.body.classList.remove('nav-lock');
  if (!S.token || !S.user) return renderLogin();
  if (S.user.mustChange) return renderForceChange();
  renderShell();
}

function logoutLocal(){ Object.keys(CACHE).forEach(k => delete CACHE[k]); rcClear(); store.del('ibvn_me1'); S.payPin = ''; S.token=null; S.user=null; store.del('ibvn_token'); render(); }
async function logout(){ if (S.user && S.user.imp) return stopImp(); try { await call('logout', { token:S.token }); } catch(e){} logoutLocal(); }

function logoHtml(cls=''){ const src = (S.links && S.links.logo) || DEFAULT_LOGO; return `<div class="logo img ${cls}"><img src="${esc(src)}" alt="Inside Bridge"></div>`; }
function avatarHtml(u, cls='', style=''){ u = u || {}; return `<div class="avatar ${cls}" style="${style}" title="${esc(u.name||'')}">${u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc(initials(u.name))}</div>`; }

function renderLogin(){
  $('#root').innerHTML = `<div class="auth">
    <section class="auth-hero">
      <div class="ring a"></div><div class="ring b"></div><div class="ring c"></div>
      <div class="brandline">${logoHtml()}INSIDE BRIDGE VIETNAM</div>
      <div>
        <h1>Mọi việc ở IBVN,<br>gói gọn trong <em>một nơi</em>.</h1>
        <p class="lead">Đơn từ, phê duyệt, chấm công, phòng họp và phiếu lương. Đăng nhập một lần là dùng được hết.</p>
      </div>
      <div class="float-zone" aria-hidden="true">
        <div class="fcard a"><div class="fi hu-mint" style="background:var(--hb);color:var(--hi)">${ic('door')}</div><div><b>Đã quét thẻ · 07:58</b><span>Cổng phụ · đúng giờ</span></div></div>
        <div class="fcard b"><div class="fi hu-peach" style="background:var(--hb);color:var(--hi)">${ic('plane')}</div><div><b>Đơn nghỉ phép năm</b><span>Đã ghi nhận · 1 ngày</span></div></div>
        <div class="fcard c"><div class="fi hu-lilac" style="background:var(--hb);color:var(--hi)">${ic('calendar')}</div><div><b>Phòng họp · 14:00–15:00</b><span>Review KOL tháng 11</span></div></div>
      </div>
    </section>
    <section class="auth-side">
      <form class="auth-form" id="f-login" autocomplete="on">
        <div class="langsw" id="lang-sw" style="align-self:flex-end" title="Ngôn ngữ / 언어"><button data-l="vi" class="${LANG === 'vi' ? 'on' : ''}">VI</button><button data-l="ko" class="${LANG === 'ko' ? 'on' : ''}">한</button></div>
        <h2>Chào mừng trở lại</h2>
        <p class="sub">Đăng nhập bằng mã nhân viên của bạn</p>
        <div class="field"><label for="l-id">Mã nhân viên</label><input class="input lg" id="l-id" name="username" autocomplete="username" placeholder="IBVN000xx" required style="text-transform:uppercase"></div>
        <div class="field"><label for="l-pw">Mật khẩu</label><div class="pw-wrap"><input class="input lg" id="l-pw" type="password" name="password" autocomplete="current-password" required><button type="button" data-eye="l-pw" aria-label="Hiện mật khẩu">${ic('eye')}</button></div></div>
        <label class="check"><input type="checkbox" id="l-rem" checked> Ghi nhớ đăng nhập trên máy này</label>
        <button class="btn primary lg block" id="l-btn">Đăng nhập ${ic('arrowR')}</button>
        <div class="hint">${ic('info')} Lần đầu đăng nhập, mật khẩu là <b>123456</b>. Hệ thống sẽ yêu cầu bạn đổi mật khẩu mới. Quên mật khẩu thì báo admin để đặt lại.${(IS_GAS || API_URL) ? '' : '<br><br><b>Bản demo:</b> IBVN00057 / 123456 (admin) hoặc IBVN00092 / 123456 (nhân viên).'}</div>
      </form>
    </section></div>`;
  $('.hint svg') && ($('.hint svg').style.cssText = 'width:15px;height:15px;vertical-align:-3px;color:var(--brand)');
  bindEyes();
  $('#lang-sw').onclick = e => { const b = e.target.closest('[data-l]'); if (b && b.dataset.l !== LANG) setLang(b.dataset.l); };
  $('#l-id').value = store.get('ibvn_lastid') || '';
  ($('#l-id').value ? $('#l-pw') : $('#l-id')).focus();
  $('#f-login').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#l-btn'); busy(btn, true, 'Đang đăng nhập…');
    try {
      const id = $('#l-id').value.trim().toUpperCase();
      const d = await call('login', { id, pw: $('#l-pw').value });
      S.token = d.token; S.user = d.user; S.links = d.links; meSave({ user:d.user, links:d.links });
      store.set('ibvn_lastid', id);
      if ($('#l-rem').checked) store.set('ibvn_token', d.token); else store.del('ibvn_token');
      render();
    } catch(err) { toast(err.message, 'err'); busy(btn, false); $('#l-pw').select(); }
  });
}

function bindEyes(root=document){
  $$('[data-eye]', root).forEach(b => b.onclick = () => { const i = document.getElementById(b.dataset.eye); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = ic(show ? 'eyeoff' : 'eye'); });
}

/* ---------- Password ---------- */
const RULES = [
  ['len', 'Ít nhất 8 ký tự', p => p.length >= 8],
  ['up', 'Có chữ viết hoa (A–Z)', p => /[A-Z]/.test(p)],
  ['num', 'Có số (0–9)', p => /[0-9]/.test(p)],
  ['sp', 'Có ký tự đặc biệt (!@#…)', p => /[^A-Za-z0-9]/.test(p)]
];
function pwForm(prefix, needOld=true){
  return `${needOld ? `<div class="field"><label>Mật khẩu hiện tại</label><div class="pw-wrap"><input class="input" id="${prefix}-old" type="password" autocomplete="current-password"><button type="button" data-eye="${prefix}-old">${ic('eye')}</button></div></div>` : ''}
    <div class="field"><label>Mật khẩu mới</label><div class="pw-wrap"><input class="input" id="${prefix}-new" type="password" autocomplete="new-password"><button type="button" data-eye="${prefix}-new">${ic('eye')}</button></div></div>
    <div class="rules" id="${prefix}-rules">${RULES.map(r => `<div data-r="${r[0]}">${ic('circle')}<span>${r[1]}</span></div>`).join('')}</div>
    <div class="field"><label>Nhập lại mật khẩu mới</label><div class="pw-wrap"><input class="input" id="${prefix}-re" type="password" autocomplete="new-password"><button type="button" data-eye="${prefix}-re">${ic('eye')}</button></div></div>`;
}
function bindPwForm(prefix){
  bindEyes();
  const n = $('#'+prefix+'-new');
  n.addEventListener('input', () => RULES.forEach(r => { const el = $(`#${prefix}-rules [data-r="${r[0]}"]`); const ok = r[2](n.value); el.classList.toggle('ok', ok); el.querySelector('svg').innerHTML = IC[ok ? 'check' : 'circle']; }));
}
async function submitPw(prefix, oldDefault){
  const oldPw = oldDefault != null ? oldDefault : $('#'+prefix+'-old').value;
  const newPw = $('#'+prefix+'-new').value, re = $('#'+prefix+'-re').value;
  const bad = RULES.find(r => !r[2](newPw));
  if (bad) throw new Error('Mật khẩu mới chưa đạt: ' + bad[1].toLowerCase());
  if (newPw !== re) throw new Error('Hai lần nhập mật khẩu mới không khớp');
  return call('changePassword', { oldPw, newPw });
}

    { label:'Đổi mật khẩu', icon:'lock', key:'caidat', group:'Thao tác nhanh', hue:'sand' }
  ];
  const pages = NAV.flatMap(g => g.items.filter(it => !it.role || has(it.role)).map(it => ({ label:it.label, icon:it.icon, key:it.key, sub:it.desc || it.sub, group:'Trang', hue:HUE[it.key] })));
  const all = actions.concat(pages);
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg kbg"><div class="kbox" role="dialog" aria-label="Tìm nhanh"><div class="k-in">${ic('search')}<input id="k-q" placeholder="Tìm tiện ích, ví dụ: nghỉ phép, phòng họp…" autocomplete="off"><kbd>Esc</kbd></div><div class="k-list" id="k-l"></div></div></div>`;
  let idx = 0, list = all;
  const draw = () => {
    let g = '';
    $('#k-l').innerHTML = list.length ? list.map((it, i) => { const h = it.group !== g ? `<div class="k-g">${esc(it.group)}</div>` : ''; g = it.group;
      return h + `<div class="k-it hu-${it.hue || 'peach'} ${i === idx ? 'on' : ''}" data-i="${i}"><div class="ic">${ic(it.icon)}</div><div><b>${esc(it.label)}</b>${it.sub ? `<span>${esc(it.sub)}</span>` : ''}</div></div>`; }).join('')
      : `<div class="empty" style="padding:26px">Không tìm thấy “${esc($('#k-q').value)}”</div>`;
  };
  const pick = it => { root.innerHTML = ''; if (!it) return; if (it.pre) S.pre = { dontu: it.pre }; go(it.key); };
  draw();
  const q = $('#k-q'); q.focus();
  q.oninput = () => { const s = nrm(q.value); list = all.filter(it => nrm(it.label + ' ' + (it.sub || '')).includes(s)); idx = 0; draw(); };
  q.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, list.length - 1); draw(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); draw(); }
    if (e.key === 'Enter') { e.preventDefault(); pick(list[idx]); }
  };
  root.querySelector('.modal-bg').addEventListener('click', e => { const it = e.target.closest('.k-it'); if (it) pick(list[+it.dataset.i]); else if (e.target.classList.contains('modal-bg')) root.innerHTML = ''; });
}

const toMin = s => { const m = String(s||'').match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };

/** Thanh giờ vào → ra theo ngày. days: [{date, first, last}] (HH:MM) */
function rangeChart(days){
  const H0 = 6, H1 = 22, span = (H1 - H0) * 60, pct = m => Math.max(0, Math.min(100, (m - H0 * 60) / span * 100));
  const ticks = [6, 8, 10, 12, 14, 16, 18, 20, 22];
  const s0 = pct(8 * 60), s1 = pct(17 * 60 + 30);
  return `<div class="rc"><div class="rc-axis"><div></div><div class="ax">${ticks.map(h => `<span style="left:${pct(h * 60)}%">${h}h</span>`).join('')}</div></div>
    ${days.map((d, i) => { const dt = parseISO(d.date), a = toMin(d.first), b = toMin(d.last);
      const left = pct(a), w = b != null ? pct(b) - left : 0;
      return `<div class="rc-row"><div class="rc-lab"><b>${WD[dt.getDay()]} ${pad(dt.getDate())}/${pad(dt.getMonth()+1)}</b><span>${b != null ? ((b - a) / 60).toFixed(1).replace('.0','') + ' giờ' : 'Thiếu giờ ra'}</span></div>
        <div class="rc-track"><div class="rc-shift" style="left:${s0}%;width:${s1 - s0}%"></div>
        ${a == null ? '' : `<div class="rc-bar ${b == null ? 'single' : ''} ${w < 22 ? 'narrow' : ''}" style="left:${left}%;width:${w}%;animation-delay:${i * 60}ms"><span>${d.first}</span>${b != null ? `<span>${d.last}</span>` : ''}</div>`}</div></div>`; }).join('')}</div>
    <div class="rc-legend"><span><i style="background:var(--grad)"></i>Có mặt (lần quét đầu → cuối)</span><span><i style="background:var(--brand-soft);border:1px dashed var(--brand)"></i>Ca chuẩn 08:00–17:30</span><span><i style="background:var(--warn)"></i>Chỉ có 1 lượt quét</span></div>`;
}

function dayTimeline(events){
  const H0 = 7, H1 = 21, span = (H1 - H0) * 60, pct = m => Math.max(0, Math.min(100, (m - H0 * 60) / span * 100));
  const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
  return `<div class="tl"><div class="tl-axis">${Array.from({ length:H1 - H0 + 1 }, (_, i) => H0 + i).filter(h => h % 2 === 1).map(h => `<span style="left:${pct(h * 60)}%">${pad(h)}:00</span>`).join('')}</div>
    <div class="tl-track">${events.filter(e => !e.allDay).map(e => { const a = toMin(hhmm(e.start)), b = toMin(hhmm(e.end)); return `<div class="tl-ev ${e.mine ? 'mine' : ''}" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%" title="${esc(e.title)}"><b>${esc(e.title.replace(/ – [^–]+$/, ''))}</b><span>${hhmm(e.start)}–${hhmm(e.end)}</span></div>`; }).join('')}
    ${nm >= H0 * 60 && nm <= H1 * 60 ? `<div class="tl-now" style="left:${pct(nm)}%" title="Bây giờ"></div>` : ''}</div>
    <div class="tl-list">${events.map(e => `<div class="tl-li ${e.mine ? 'mine' : ''}"><b class="tnum">${e.allDay ? 'Cả ngày' : hhmm(e.start) + '–' + hhmm(e.end)}</b><span>${esc(e.title)}</span>${e.mine ? '<span class="pill brand">Của bạn</span>' : ''}${toMin(hhmm(e.end)) < nm ? '<span class="pill">Đã xong</span>' : toMin(hhmm(e.start)) <= nm ? '<span class="pill ok">Đang họp</span>' : ''}</div>`).join('')}</div></div>`;
}

function miniCal(eventDates){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1), start = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const cells = []; for (let i = 0; i < start; i++) cells.push('<div class="d out"></div>');
  for (let d = 1; d <= days; d++) { const dt = new Date(y, m, d), iso = isoDate(dt); cells.push(`<div class="d ${d === now.getDate() ? 'today' : ''} ${dt.getDay() === 0 || dt.getDay() === 6 ? 'we' : ''} ${eventDates.has(iso) ? 'has' : ''}">${d}</div>`); }
  return `<div class="mcal"><div class="mcal-h"><span>Tháng ${m + 1}, ${y}</span><span class="small muted" style="font-family:var(--fb);font-weight:500">● có lịch họp</span></div><div class="mcal-g">${['T2','T3','T4','T5','T6','T7','CN'].map(w => `<div class="wd">${w}</div>`).join('')}${cells.join('')}</div></div>`;
}

function countUp(el){ $$('[data-count]', el).forEach(n => { const to = +n.dataset.count; let t0; const step = ts => { t0 = t0 || ts; const p = Math.min(1, (ts - t0) / 700); n.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); }

const RICH_TAGS = { B:1, STRONG:1, I:1, EM:1, U:1, S:1, STRIKE:1, BR:1, P:1, DIV:1, SPAN:1, FONT:1, UL:1, OL:1, LI:1, A:1, H3:1, H4:1, BLOCKQUOTE:1 };
const RICH_CSS = ['color', 'background-color', 'font-size', 'font-family', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line', 'text-align'];
function richClean(html){
  const doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html');
  const walk = node => {
    Array.from(node.childNodes).forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1) { n.remove(); return; }
      if (!RICH_TAGS[n.tagName]) {
        if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|svg|SVG|MATH|TEMPLATE)$/.test(n.tagName)) { n.remove(); return; }
        walk(n); n.replaceWith(...Array.from(n.childNodes)); return;
      }
      Array.from(n.attributes).forEach(a => {
        const k = a.name.toLowerCase();
        if (k === 'style') {
          const keep = [];
          String(a.value).split(';').forEach(d => { const i = d.indexOf(':'); if (i < 0) return; const p = d.slice(0, i).trim().toLowerCase(), v = d.slice(i + 1).trim();
            if (RICH_CSS.includes(p) && !/url\(|expression|javascript/i.test(v)) keep.push(p + ':' + v); });
          if (keep.length) n.setAttribute('style', keep.join(';')); else n.removeAttribute('style');
        } else if (n.tagName === 'FONT' && (k === 'color' || k === 'size' || k === 'face')) {
        } else if (n.tagName === 'A' && k === 'href') {
          if (!/^(https?:|mailto:)/i.test(a.value.trim())) n.removeAttribute('href');
        } else n.removeAttribute(a.name);
      });
      if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); }
      walk(n);
    });
  };
  walk(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}
const looksHtml = s => /<(b|strong|i|em|u|s|br|p|div|span|font|ul|ol|li|a|h3|h4|blockquote)\b[^>]*>/i.test(String(s || ''));
function richHtml(body){
  const s = String(body || '');
  return looksHtml(s) ? richClean(s) : esc(s).replace(/\n/g, '<br>');
}
function rteHtml(){
  const B = (cmd, label, title, arg) => `<button type="button" data-cmd="${cmd}" ${arg ? `data-arg="${arg}"` : ''} title="${title}">${label}</button>`;

function rteInit(ed, body){
  ed.innerHTML = richHtml(body);
  const bar = ed.previousElementSibling;
  const exec = (cmd, arg) => { ed.focus(); try { document.execCommand('styleWithCSS', false, true); } catch(e){} document.execCommand(cmd, false, arg); };
  bar.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  bar.onclick = e => {
    const b = e.target.closest('[data-cmd]'); if (!b) return;
    if (b.dataset.cmd === 'createLink') { const u = prompt('Dán đường dẫn (bắt đầu bằng http hoặc https):'); if (u && /^(https?:|mailto:)/i.test(u.trim())) exec('createLink', u.trim()); return; }
    exec(b.dataset.cmd, b.dataset.arg ? '<' + b.dataset.arg + '>' : null);
  };
  bar.querySelectorAll('[data-sel]').forEach(sel => sel.onchange = () => { if (sel.value) exec(sel.dataset.sel, sel.value); sel.value = ''; });
  bar.querySelectorAll('[data-clr]').forEach(inp => inp.oninput = () => exec(inp.dataset.clr, inp.value));
  ed.addEventListener('paste', e => {
    const h = e.clipboardData && e.clipboardData.getData('text/html'), t = e.clipboardData && e.clipboardData.getData('text/plain');
    e.preventDefault();
    document.execCommand('insertHTML', false, h ? richClean(h) : esc(t || '').replace(/\n/g, '<br>'));
  });
}

    if (rx) { const id = rx.closest('[data-rx]').dataset.rx; rx.disabled = true;
      try { const u = await call('ann.react', { id, emoji: rx.dataset.em }); if (u) { const i = S.ann.findIndex(a => a.id === id); if (i >= 0) S.ann[i] = { ...S.ann[i], react: u.react, myReact: u.myReact }; } draw(); }
      catch(err) { toast(err.message, 'err'); rx.disabled = false; } return; }
    const lk = e.target.closest('[data-link]');
    if (lk) { const url = annUrl(lk.dataset.link); try { await navigator.clipboard.writeText(url); toast('Đã sao chép link thông báo'); } catch(err) { modal('Link thông báo', `<input class="input" value="${esc(url)}" readonly onclick="this.select()">`, '<button class="btn primary" data-close>Đóng</button>'); } return; }
    const st = e.target.closest('[data-stats]');

  };
};

/* ---------- Đánh giá nhân sự (hạn hợp đồng) ---------- */
const dLeft = n => n == null ? '' : n < 0 ? `Đã hết hạn ${-n} ngày` : n === 0 ? 'Hết hạn hôm nay' : `Còn ${n} ngày`;
VIEWS.nhansu = async el => {
  if (!has('HRVIEW')) { el.innerHTML = errBox('Bạn không có quyền vào trang này'); return; }
  el.innerHTML = skel(4, 60);
  const d = await call('hr.team');
  let q = '', only = false;
  const draw = () => {
    const warnList = d.list.filter(x => x.daysLeft != null && x.daysLeft <= d.warn);
    const rows = d.list.filter(x => (!only || (x.daysLeft != null && x.daysLeft <= d.warn)) && (!q || (x.name + x.id + x.dept + x.position).toLowerCase().includes(q)));
    el.innerHTML = `<div class="stack">
      ${warnList.length ? `<div class="hr-alarm">${ic('info')}<div><b>${warnList.length} nhân sự sắp hết hạn hợp đồng (≤ ${d.warn} ngày)</b><div class="small">Cần lên lịch review: ${warnList.slice(0, 6).map(x => esc(x.name)).join(', ')}${warnList.length > 6 ? '…' : ''}</div></div></div>` : ''}
      <div class="card"><div class="card-h" style="flex-wrap:wrap;gap:10px"><h3><span class="hi">${ic('users')}</span>${d.all ? 'Toàn bộ nhân sự' : 'Nhân sự team của bạn'} <span class="small muted" style="font-weight:500">(${d.list.length} người)</span></h3><span class="spacer"></span>
        <input class="input sm" id="hr-q" placeholder="Tìm tên, mã NV, bộ phận…" style="max-width:240px" value="${esc(q)}">
        <label class="check small"><input type="checkbox" id="hr-only" ${only ? 'checked' : ''}> Chỉ người sắp hết hạn</label></div>
        ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nhân viên</th><th>Bộ phận / chức vụ</th><th>Loại hợp đồng</th><th>Bắt đầu</th><th>Kết thúc</th><th>Còn lại</th></tr></thead><tbody>
          ${rows.map(x => { const bad = x.daysLeft != null && x.daysLeft <= d.warn; return `<tr class="${bad ? 'hr-bad' : ''}"><td><div class="row" style="gap:10px;flex-wrap:nowrap">${avatarHtml(x)}<div><b>${esc(x.name)}</b><div class="small muted">${esc(x.id)}</div></div></div></td>
            <td>${esc(x.dept)}<div class="small muted">${esc(x.position)}</div></td><td class="small">${esc(x.type || '—')}${x.no ? `<div class="muted">${esc(x.no)}</div>` : ''}</td>
            <td class="tnum">${x.start ? vnDate(x.start) : '—'}</td><td class="tnum"><b>${x.end ? vnDate(x.end) : '—'}</b></td>
            <td>${x.end ? `<span class="pill ${bad ? 'bad' : x.daysLeft <= d.warn * 2 ? 'warn' : 'ok'}">${bad ? ic('info') : ''}${esc(dLeft(x.daysLeft))}</span>${bad ? '<div class="small" style="color:var(--bad);margin-top:4px">Sắp đến thời gian review</div>' : ''}` : '<span class="small muted">Không thời hạn / chưa có</span>'}</td></tr>`; }).join('')}</tbody></table></div>`
          : `<div class="empty"><div class="ico">${ic('users')}</div><b>Không có nhân sự</b>${d.all ? '' : 'Danh sách theo bộ phận của bạn trong Danh Sách NV.'}</div>`}</div>
      <p class="small muted">Dữ liệu hợp đồng lấy từ tab Danh Sách NV (file đơn từ), tự cập nhật mỗi giờ.</p></div>`;
    const qi = $('#hr-q', el); qi.oninput = () => { q = qi.value.toLowerCase(); const pos = qi.selectionStart; draw(); const n = $('#hr-q', el); n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} };
    $('#hr-only', el).onchange = e => { only = e.target.checked; draw(); };
  };
  draw();
};

async function drawStaffReq(b){
  b.innerHTML = `<div class="stack"><div class="card"><div class="card-b row" style="gap:10px;padding-top:16px;flex-wrap:wrap"><label class="small muted" for="ds-emp">Chọn nhân viên</label>

  let month = curM, all = [];

  mOpts();
  $('#ds-m').onchange = e => { month = e.target.value; paintStaff(); };
  const emps = await call('req.emps');
  $('#ds-emp').innerHTML = '<option value="">— Chọn nhân viên —</option><option value="*ALL*">★ Tất cả nhân viên</option>' + emps.map(e => `<option value="${esc(e.id)}">${esc(e.name)} · ${esc(e.id)}${e.dept ? ' · ' + esc(e.dept) : ''}</option>`).join('');
  $('#ds-emp').onchange = async e => {
    const id = e.target.value, box = $('#ds-b');
    if (!id) { box.innerHTML = ''; return; }
    box.innerHTML = skel(3, 50);

/* ---------- Mã PIN xem lương ---------- */
function pinPad(el, opts){
  return new Promise(resolve => {
    let val = '', first = '';
    const draw = (msg, err) => {
      el.innerHTML = `<div class="card pin-card"><div class="pin-ico">${ic('lock')}</div><h3>${esc(opts.title)}</h3><p class="muted small" style="margin:0 0 10px">${esc(msg || opts.sub)}</p>
        <div class="pin-dots ${err ? 'shake' : ''}">${[0,1,2,3].map(i => `<span class="${i < val.length ? 'on' : ''}"></span>`).join('')}</div>
        <div class="pin-keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
        ${opts.foot ? `<p class="small muted" style="margin:12px 0 0">${opts.foot}</p>` : ''}</div>`;
      el.querySelector('.pin-keys').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; press(b.dataset.k); };
    };
    const press = async k => {
      if (k === '⌫') { val = val.slice(0, -1); draw(); return; }
      if (val.length >= 4) return;
      val += k; draw();
      if (val.length < 4) return;
      if (opts.mode === 'create' && !first) { first = val; val = ''; draw('Nhập lại mã một lần nữa để xác nhận'); return; }
      if (opts.mode === 'create' && first !== val) { first = ''; val = ''; draw('Hai lần nhập không khớp, nhập lại từ đầu', true); return; }
      const v = val; val = '';
      try { await opts.submit(v); document.removeEventListener('keydown', kb); resolve(v); }
      catch(err) { first = ''; draw(err.message, true); }
    };
    const kb = e => { if (!el.isConnected) { document.removeEventListener('keydown', kb); return; } if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); };
    document.addEventListener('keydown', kb);
    draw();
  });
}

const attSecs = t => { const m = String(t || '').trim().match(/(\d{1,2}):(\d{2})(?::(\d{2}))?$/); return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0)) : null; };
const attHM = t => { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); return m ? pad(+m[1]) + ':' + m[2] : ''; };
const attHms = n => n == null ? '' : `${pad(Math.floor(n / 3600))}:${pad(Math.floor(n % 3600 / 60))}`;
/** Khung giờ linh hoạt: vd "08:00-17:30,09:00-18:30,10:00-19:30" */
const attSlots = str => String(str || '').split(/[,;\n]+/).map(x => x.split('-')).filter(x => x.length === 2 && attSecs(x[0].trim()) != null && attSecs(x[1].trim()) != null)
  .map(x => ({ i: attSecs(x[0].trim()), o: attSecs(x[1].trim()), l: attHM(x[0]) + '–' + attHM(x[1]) })).sort((a, b) => a.i - b.i);
/** Chọn khung theo giờ vào: quét từ (giờ khung − N phút) trở đi tính vào khung đó; vd N=15: 8:45 → khung 9h, 8:44 → khung 8h (trễ) */
const attPickSlot = (slots, a, som) => { let k = slots[0]; if (a == null) return k; slots.forEach(x => { if (a >= x.i - som) k = x; }); return k; };
/* Đối chiếu đơn từ: đi trễ ↔ đơn Đi trễ, về sớm ↔ đơn Về sớm, quên quét ↔ đơn Quên chấm công; đơn Xin nghỉ ngày đó tính cho mọi trường hợp */
const DT_NEED = { late:1, early:1, noin:1, noout:1, absent:1 };
const dtNorm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'D').toUpperCase();
const DT_FOR = { late: d => d.t === 'tre' && /TRE/.test(dtNorm(d.k)), early: d => d.t === 'tre' && /SOM/.test(dtNorm(d.k)), noin: d => d.t === 'quen', noout: d => d.t === 'quen', absent: () => false };
const DT_NM = { late:'đi trễ', early:'về sớm', noin:'quên check-in', noout:'quên check-out', absent:'nghỉ' };
/** Từng lỗi phải có đơn tương ứng; đơn Xin nghỉ ngày đó tính cho mọi lỗi */
function dtMatch(list, flags, fullOff){
  list = list || [];
  const off = list.filter(d => d.t === 'nghi'), dts = off.slice(), miss = [];
  flags.filter(f => DT_NEED[f]).forEach(f => {
    const hit = list.filter(DT_FOR[f]);
    hit.forEach(d => { if (!dts.includes(d)) dts.push(d); });
    // đơn nghỉ cả ngày → mọi lỗi đều có đơn; nghỉ nửa buổi → chỉ tính cho thiếu quét / không có dữ liệu (trễ, sớm đã tính theo buổi)
    const offOk = off.length && (fullOff || f === 'absent' || f === 'noin' || f === 'noout');
    if (!hit.length && !offOk) miss.push(f);
  });
  return { dts, miss };

async function parseLockFile(file){

  const wb = XLSX.read(buf, { type:'array', cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  const hi = aoa.findIndex(r => r.some(c => /tài khoản|account|user|operator/i.test(String(c))) && r.some(c => /ngày|date|time|thời gian/i.test(String(c))));
  if (hi < 0) throw new Error('Không thấy dòng tiêu đề (Tài khoản / Ngày). Có đúng file Records xuất từ TTLock không?');
  const H = aoa[hi].map(c => String(c).toLowerCase());
  const col = re => H.findIndex(h => re.test(h));
  const cN = col(/tài khoản|account|user|operator/), cT = col(/loại|type|method/), cS = col(/trạng thái|status|result/), cD = col(/ngày|date|time|thời gian/);

    if (v instanceof Date) return `${isoDate(v)} ${pad(v.getHours())}:${pad(v.getMinutes())}:${pad(v.getSeconds())}`;
    if (typeof v === 'number') { const p = XLSX.SSF.parse_date_code(v); return `${p.y}-${pad(p.m)}-${pad(p.d)} ${pad(p.H)}:${pad(p.M)}:${pad(Math.floor(p.S))}`; }

    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(m[4])}:${m[5]}:${m[6] || '00'}`;
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])} ${pad(m[4])}:${m[5]}:${m[6] || '00'}`;
    return '';

    const x = $('#ee-x', m.el); if (x) x.onclick = () => { m.close(); askCancel(id); };
    $('#ee-ok', m.el).onclick = async ev2 => { busy(ev2.currentTarget, true, 'Đang lưu…'); try { await call('room.update', { id, title: $('#ee-t').value, date: $('#ee-d').value, start: $('#ee-s').value, end: $('#ee-e').value, note: $('#ee-n').value }); m.close(); toast('Đã cập nhật lịch họp'); load(); } catch(err) { toast(err.message, 'err'); busy(ev2.currentTarget, false); } };
  };
  const askCancel = id => {
    const ev = events.find(x => x.id === id); if (!ev) return;
    if (parseISO(ev.start) < new Date()) return toast('Cuộc họp đã bắt đầu, không huỷ được', 'err');
    const m = modal('Huỷ lịch họp?', `<p style="margin:0"><b>${esc(ev.title)}</b><br>${vnDateTime(ev.start)} – ${hhmm(ev.end)}</p>`, '<button class="btn ghost" data-close>Không</button><button class="btn danger" id="cx-ok">Huỷ lịch</button>');
    $('#cx-ok', m.el).onclick = async () => { try { await call('room.cancel', { id }); m.close(); toast('Đã huỷ lịch'); load(); } catch(err) { toast(err.message, 'err'); } };
  };
  const load = async () => {
    const f = fromDate(), t = new Date(f); t.setDate(t.getDate() + 6);
    $('#ph-rng').textContent = `${pad(f.getDate())}/${pad(f.getMonth()+1)} – ${pad(t.getDate())}/${pad(t.getMonth()+1)}`;
    $('#ph-p').disabled = off === 0;
    $('#ph-list').innerHTML = skel(4, 48);
    try { events = (await call('room.list', { from: isoDate(f), days: 7 })).events; paint(); showDay(); }
    catch(err) { $('#ph-list').innerHTML = `<div class="card-b">${errBox(err.message)}</div>`; }
  };
  $('#ph-p').onclick = () => { if (off > 0) { off--; load(); } };
  $('#ph-n2').onclick = () => { off++; load(); };
  $('#ph-r').onclick = load;
  $('#ph-v').onclick = e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; $$('#ph-v button').forEach(x => x.classList.toggle('on', x === b)); paint(); };
  $('#ph-f').addEventListener('submit', async e => {
    e.preventDefault();
    const b = $('#ph-b'); busy(b, true, 'Đang đặt…');
    try { await call('room.book', { title: $('#ph-t').value, date: $('#ph-d').value, start: $('#ph-s').value, end: $('#ph-e').value, note: $('#ph-n').value }); toast('Đã đặt phòng, lịch đã lên Google Calendar'); $('#ph-t').value = ''; $('#ph-n').value = ''; busy(b, false); load(); }
    catch(err) { toast(err.message, 'err'); busy(b, false); }
  });
  await load();
};

VIEWS.dontu = async el => {
  el.innerHTML = `<div class="stack"><div class="row"><div class="seg" id="dt-tab"><button class="on" data-t="new">Tạo đơn</button><button data-t="my">Đơn của tôi</button>${S.links.dtAll ? '<button data-t="staff">Đơn của nhân viên</button>' : ''}</div>
    <div class="spacer"></div>${S.links.dontu ? `<a class="btn sm ghost" href="${esc(S.links.dontu)}" target="_blank" rel="noopener">${ic('ext')}Web đơn từ cũ</a>` : ''}</div><div id="dt-b"></div></div>`;
  const b = $('#dt-b');
  let type = (S.pre && S.pre.dontu) || ''; const startTab = (S.pre && S.pre.dontuTab) || 'new'; S.pre = null;
  let monthF = startTab === 'my' ? 'cur' : 'all';
  const drawNew = () => {
    b.innerHTML = `<div class="stack"><div class="types" id="dt-types">${Object.keys(DT).map(k => `<button class="type hu-${DTH[k]} ${k === type ? 'on' : ''}" data-k="${k}"><div class="ic">${ic(DT[k].icon)}</div><b>${DT[k].label}</b><span>${DT[k].desc}</span></button>`).join('')}</div><div id="dt-form"></div></div>`;
    $('#dt-types').onclick = e => { const t = e.target.closest('.type'); if (!t) return; type = t.dataset.k; $$('#dt-types .type').forEach(x => x.classList.toggle('on', x === t)); drawForm(); };
    if (type) drawForm();
    else $('#dt-form').innerHTML = `<div class="card"><div class="empty"><div class="ico">${ic('file')}</div><b>Chọn loại đơn ở trên để bắt đầu</b>Thông tin nhân viên được điền sẵn, bạn chỉ cần điền phần còn lại.</div></div>`;
  };
  const drawForm = () => {
    const T = DT[type], today = isoDate(new Date());
    const fld = f => {
      const lab = `<label>${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
      let inp;
      if (f.t === 'chips') inp = `<div class="chips" data-chips="${f.k}">${f.o.map((o, i) => `<button type="button" class="chip ${i === 0 ? 'on' : ''}" data-v="${esc(o)}">${esc(vi(o))}</button>`).join('')}</div>`;
      else if (f.t === 'textarea') inp = `<textarea class="textarea" data-k="${f.k}"></textarea>`;
      else inp = `<input class="input" data-k="${f.k}" type="${f.t === 'date' ? 'date' : f.t === 'time' ? 'time' : 'text'}" ${f.ro ? 'readonly' : ''} ${f.t === 'date' ? `value="${today}"` : ''}>`;
      return `<div class="field ${f.full ? 'full' : ''}">${lab}${inp}</div>`;
    };
    $('#dt-form').innerHTML = `<div class="card"><div class="card-h"><h3><span class="hi">${ic(T.icon)}</span>${T.label}</h3><span class="pill brand">${esc(S.user.id)}</span></div>
      <form class="card-b stack" id="dt-f">
        <div class="form-grid">
          <div class="field"><label>Họ và tên</label><input class="input" readonly value="${esc(S.user.name)}"></div>
          <div class="field"><label>Phòng ban · Vị trí</label><input class="input" readonly value="${esc(S.user.dept)} · ${esc(S.user.position)}"></div>
        </div>
        <div style="border-top:1px dashed var(--line-2)"></div>
        <div class="form-grid">${T.fields.map(fld).join('')}
          <div class="field full"><label>Ghi chú thêm</label><input class="input" data-k="ghichu" placeholder="Không bắt buộc"></div>
          <div class="field full"><label>File đính kèm</label><input class="input" type="file" id="dt-file"><span class="small muted">Giấy khám bệnh, email xác nhận… tối đa 10MB</span></div>
        </div>
        <div class="row"><div class="spacer"></div><button type="button" class="btn ghost" id="dt-reset">Làm lại</button><button class="btn primary lg" id="dt-send">Gửi đơn</button></div>
      </form></div>`;
    const f = $('#dt-f');
    f.addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; $$('.chip', c.parentElement).forEach(x => x.classList.toggle('on', x === c)); calc(); });
    const val = k => { const ch = $(`[data-chips="${k}"] .chip.on`, f); if (ch) return ch.dataset.v; const i = $(`[data-k="${k}"]`, f); return i ? i.value.trim() : ''; };
    const set = (k, v) => { const i = $(`[data-k="${k}"]`, f); if (i) i.value = v; };
    const calc = () => {
      if (type === 'nghi') {
        const a = parseISO(val('tu')), z = parseISO(val('den'));
        if (a && z && z >= a) { let n = 0; for (let d = new Date(a); d <= z; d.setDate(d.getDate() + 1)) if (d.getDay() !== 0) n++; if (/NỬA/.test(val('buoi'))) n *= 0.5; set('tong', fmtNum(n) + ' ngày'); } else set('tong', '');
      }
      if (type === 'ot') { const a = val('tu'), z = val('den'); if (a && z) { const [h1, m1] = a.split(':').map(Number), [h2, m2] = z.split(':').map(Number); const h = (h2 * 60 + m2 - h1 * 60 - m1) / 60; set('tong', h > 0 ? fmtNum(h) + ' giờ' : ''); } }
    };
    f.addEventListener('input', calc); f.addEventListener('change', e => { if (type === 'nghi' && e.target.dataset.k === 'tu' && val('den') < val('tu')) set('den', val('tu')); calc(); });
    calc();
    $('#dt-reset').onclick = drawForm;
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const data = {};
      for (const fd of T.fields) { data[fd.k] = val(fd.k); if (fd.req && !data[fd.k]) return toast(`Vui lòng điền "${fd.l}"`, 'err'); }
      data.ghichu = val('ghichu');
      if (type === 'nghi' && data.den < data.tu) return toast('Ngày kết thúc phải sau ngày bắt đầu', 'err');
      if ((type === 'ot' || type === 'congtac' || type === 'ccngoai' || type === 'dieuchinh') && data.den <= data.tu) return toast('Giờ kết thúc phải sau giờ bắt đầu', 'err');
      const btn = $('#dt-send'); busy(btn, true, 'Đang gửi…');
      try {
        const file = $('#dt-file').files[0];
        if (file) {
          if (file.size > 10 * 1024 * 1024) throw new Error('File tối đa 10MB');
          const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
          data.file = (await call('req.upload', { name: file.name, mime: file.type, data: b64 })).url;
        }
        await call('req.submit', { type, f: data });
        toast('Đã gửi đơn ' + T.label.toLowerCase());
        type = ''; switchTab('my');
      } catch(err) { toast(err.message, 'err'); busy(btn, false); }
    });
  };
  const drawMy = async () => {
    const curM = `${pad(new Date().getMonth()+1)}/${new Date().getFullYear()}`;
    b.innerHTML = `<div class="stack"><div class="row"><div class="seg" id="dt-mf"><button data-m="cur" class="${monthF === 'cur' ? 'on' : ''}">Tháng này</button><button data-m="all" class="${monthF === 'all' ? 'on' : ''}">Tất cả</button></div><span class="small muted">Bấm vào một đơn để xem chi tiết</span></div><div class="card" id="dt-my">${skel(4,56)}</div></div>`;
    $('#dt-mf').onclick = e => { const x = e.target.closest('button'); if (!x) return; monthF = x.dataset.m; drawMy(); };
    const all = await call('req.my');
    const list = monthF === 'cur' ? all.filter(r => r.month === curM) : all;
    if (!list.length) { $('#dt-my').innerHTML = `<div class="empty"><div class="ico">${ic('file')}</div><b>${monthF === 'cur' ? 'Tháng này bạn chưa gửi đơn nào' : 'Bạn chưa có đơn nào'}</b>Các đơn bạn gửi sẽ hiện ở đây.</div>`; return; }
    const st = r => r.status === 'sent' ? '<span class="pill ok">Đã ghi nhận</span>' : r.status === 'cancel' ? '<span class="pill">Đã huỷ</span>' : r.status === 'reject' ? '<span class="pill bad">Không duyệt</span>' : `<span class="pill warn">${esc(r.statusText)}</span>`;
    $('#dt-my').innerHTML = list.map((r, i) => `<div class="req-item clk hu-${DTH[r.type] || 'peach'}" data-i="${i}"><div class="ic">${ic((DT[r.type] || { icon:'file' }).icon)}</div>
      <div class="bd"><div class="row" style="gap:8px"><b>${esc(r.label)}</b>${st(r)}</div><div class="dt">${esc(r.detail)}</div>${r.reason ? `<div class="rs">“${esc(r.reason)}”</div>` : ''}
      <div class="small muted" style="margin-top:4px">${r.sent ? 'Gửi lúc ' + vnDateTime(r.sent) : ''}${r.file ? ` · <a href="${esc(r.file)}" target="_blank" rel="noopener">File đính kèm</a>` : ''}</div></div>
      <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm soft" data-view="${i}">${ic('eye')}Chi tiết</button>${r.status === 'sent' ? `<button class="btn sm ghost" data-cx="${r.row}">Huỷ đơn</button>` : ''}</div></div>`).join('');
    const showDetail = r => {
      const rows = (r.fields || []).map(f => `<dt>${esc(LANG === 'ko' && f.ko ? f.ko : f.vi)}</dt><dd>${/^https?:[\/][\/]/.test(f.v) ? `<a href="${esc(f.v)}" target="_blank" rel="noopener">${esc(f.v)}</a>` : esc(LANG === 'ko' ? (f.v.split(' / ')[1] || f.v) : vi(f.v))}</dd>`).join('');
      modal(r.label, `<div class="row" style="gap:8px">${st(r)}<span class="small muted">${r.sent ? 'Gửi lúc ' + vnDateTime(r.sent) : esc(r.statusText)}</span></div>
        <dl class="kv" style="margin:0">${rows || `<dt>Nội dung</dt><dd>${esc(r.detail)}</dd><dt>Lý do</dt><dd>${esc(r.reason)}</dd>`}</dl>`, '<button class="btn primary" data-close>Đóng</button>');
    };
    $('#dt-my').onclick = e => {
      const c = e.target.closest('[data-cx]');
      if (c) {
        const m = modal('Huỷ đơn này?', '<p style="margin:0">Đơn sẽ được đánh dấu "huỷ" trong sheet đơn từ và không được tính vào chấm công.</p>', '<button class="btn ghost" data-close>Không</button><button class="btn danger" id="cx">Huỷ đơn</button>');
        $('#cx', m.el).onclick = async () => { try { await call('req.cancel', { row: +c.dataset.cx }); m.close(); toast('Đã huỷ đơn'); drawMy(); } catch(err) { toast(err.message, 'err'); } };
        return;
      }
      if (e.target.closest('a')) return;
      const it = e.target.closest('.req-item'); if (it) showDetail(list[+it.dataset.i]);
    };
  };
  const switchTab = t => { $$('#dt-tab button').forEach(x => x.classList.toggle('on', x.dataset.t === t)); (t === 'my' ? drawMy : t === 'staff' ? () => drawStaffReq(b) : async () => drawNew())().catch(err => b.innerHTML = errBox(err.message)); };
  $('#dt-tab').onclick = e => { const x = e.target.closest('button'); if (x) switchTab(x.dataset.t); };
  if (startTab === 'my') switchTab('my'); else drawNew();
};

/** Thu nhỏ ảnh về hình vuông size×size (cắt giữa), trả về data URL JPEG */
function resizeImage(file, size){
  return new Promise((res, rej) => {
    if (!/^image[\/]/.test(file.type)) return rej(new Error('Chọn file ảnh (JPG, PNG…)'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      let q = .85, out = c.toDataURL('image/jpeg', q);
      while (out.length > 45000 && q > .4) { q -= .1; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh này')); };
    img.src = url;
  });
}
