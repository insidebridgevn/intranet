<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Approval Portal</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#f59a5b;          /* cam pastel chủ đạo */
  --primary-soft:#ffe6d3;
  --primary-softer:#fff3ea;
  --primary-ink:#3b1d0a;      /* chữ trên nút cam */
  --primary-deep:#c45f1f;     /* chữ/biểu tượng nhấn */
  --header:#fffaf5;
  --radius:18px;
  --bg:#fdf8f3; --card:#ffffff; --ink:#3a2a21; --ink2:#5d4a3e; --muted:#9a8576; --line:#f1e4d8; --line2:#e9d8c9; --soft:#fffaf6;
  --red:#c2413b; --red-bg:#fff0ee; --red-line:#f8cfc9;
  --amber:#a8620b; --amber-bg:#fff6e5; --amber-line:#f7deae;
  --green:#2f7d4f; --green-bg:#eefaf2; --green-line:#c6ebd4;
  --blue:#3563a8; --blue-bg:#eef4ff; --blue-line:#cfdcf5;
  --violet:#7350b8; --violet-bg:#f5f0ff; --violet-line:#e0d4f7;
  --slate:#6f6259; --slate-bg:#f4f0ec; --slate-line:#e6ddd5;
  --shadow:0 1px 2px rgba(91,52,25,.05),0 6px 18px rgba(91,52,25,.06);
  --shadow-lg:0 20px 60px rgba(60,30,10,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Be Vietnam Pro','Noto Sans KR',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.lang-ko{font-family:'Noto Sans KR','Be Vietnam Pro',system-ui,sans-serif}
a{color:var(--primary-deep)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}

/* boot */
.boot-loading{min-height:70vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--muted)}
.spinner{width:30px;height:30px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 500px at 10% -10%,#ffe2cc 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#ffe9d9 0,transparent 55%),var(--bg)}
.login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-lg);padding:30px 28px}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-brand .brand-logo{width:56px;height:56px}
.login-card h1{font-size:22px;margin:0 0 6px}
.login-card p{margin:0 0 18px;color:var(--ink2)}
.login-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--muted)}
.otp-input{letter-spacing:10px;font-size:24px!important;text-align:center;font-weight:700}
.linklike{background:none;border:0;color:var(--primary-deep);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.linklike:disabled{color:var(--muted);text-decoration:none;cursor:default}

/* ---------- header ---------- */
.topbar{background:var(--header);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(91,52,25,.05)}
.topbar-in{max-width:1280px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{width:44px;height:44px;border-radius:14px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none;box-shadow:0 4px 12px rgba(245,154,91,.35)}
.brand-logo.has-img{background:#fff;box-shadow:none;border:1px solid var(--line)}
.brand-logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:.2px;white-space:nowrap;color:var(--ink)}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langsw{display:inline-flex;background:var(--primary-softer);border:1px solid var(--line2);border-radius:999px;padding:3px}
.langsw button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink2)}
.langsw button.on{background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 6px rgba(245,154,91,.35)}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#45b36b;box-shadow:0 0 0 3px rgba(69,179,107,.18)}
.sync.off .dot{background:#e7a33c;box-shadow:0 0 0 3px rgba(231,163,60,.2)}
.userchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:5px 6px 5px 6px;border-radius:999px;cursor:pointer;position:relative}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.userchip .nm{font-weight:700;font-size:13px;line-height:1.2;padding-right:8px}
.userchip .em{font-size:11px;color:var(--muted);padding-right:8px}
.rolebadge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--primary-soft);color:var(--primary-deep);margin-left:4px;white-space:nowrap}
.usermenu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);min-width:240px;padding:8px;z-index:40}
.usermenu .info{padding:8px 10px 10px;border-bottom:1px dashed var(--line2);margin-bottom:6px;font-size:12px;color:var(--ink2)}
.usermenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:600}
.usermenu button:hover{background:var(--primary-softer)}
.tabs{max-width:1280px;margin:0 auto;padding:4px 14px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media (min-width:861px){.tabs{flex-wrap:wrap;overflow:visible;row-gap:6px}}
@media (max-width:860px){.tabs{scrollbar-width:thin;padding-bottom:10px}.tabs::-webkit-scrollbar{display:block;height:5px}.tabs::-webkit-scrollbar-thumb{background:#f2c3a0;border-radius:9px}}
.tab{border:1px solid transparent;background:transparent;color:var(--ink2);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;transition:all .15s}
.tab:hover{background:var(--primary-softer);color:var(--ink)}
.tab.active{background:var(--primary-soft);color:var(--primary-deep);border-color:#f7cfb0;font-weight:700}
.tab .ic{font-size:15px}
.badge{background:#e8664a;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-weight:700}
.topbar.dark .brand-name{color:#fff}.topbar.dark .brand-sub{color:rgba(255,255,255,.7)}
.topbar.dark .tab{color:rgba(255,255,255,.78)}.topbar.dark .tab:hover{background:rgba(255,255,255,.1);color:#fff}
.topbar.dark .tab.active{background:var(--primary-soft);color:var(--primary-deep)}
.announce{background:linear-gradient(90deg,#fff1e4,#ffe8d6);color:#7a3e14;padding:10px 20px;text-align:center;font-size:13px;border-bottom:1px solid var(--line)}

/* ---------- layout ---------- */
.main{max-width:1280px;margin:0 auto;padding:22px 20px 70px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
.page-head .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--primary-deep)}
.page-head h1{margin:2px 0 4px;font-size:26px;line-height:1.25;letter-spacing:-.2px}
.page-head p{margin:0;color:var(--ink2);font-size:13.5px;max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:10px}
.card h2 .num{width:30px;height:30px;border-radius:10px;background:var(--primary-soft);color:var(--primary-deep);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none;font-weight:800}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.span3{grid-column:1/-1}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.topbar{position:static}.sync{display:none}.userchip .em{display:none}.topbar-in{gap:8px}.top-right{margin-left:0;width:100%;justify-content:space-between}.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}.main{padding:16px 12px 70px}.topbar-in{padding:10px 12px 6px}.page-head h1{font-size:21px}.card{padding:16px}}

/* ---------- form ---------- */
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field label .req{color:var(--red)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px 13px;outline:none;transition:border .15s,box-shadow .15s}
.input:hover{border-color:#e3c5ad}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(245,154,91,.18)}
.input[readonly]{background:var(--soft);color:var(--muted)}
textarea.input{min-height:110px;resize:vertical}
.input.err{border-color:var(--red);box-shadow:0 0 0 4px rgba(194,65,59,.12)}
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow-lg);max-height:320px;overflow-y:auto;z-index:20;padding:4px}
.ac-item{padding:9px 12px;border-radius:10px;cursor:pointer}
.ac-item+.ac-item{border-top:1px solid #f6ede5}
.ac-item.on,.ac-item:hover{background:var(--primary-softer)}
.ac-n{font-weight:700;color:var(--ink)}
.ac-s{font-size:12px;color:var(--muted);margin-top:1px}
.ac-list.ac-float{position:fixed;top:auto;right:auto;z-index:1000;max-height:300px}
.ac-n b,.ac-s b{color:var(--primary-dark,#c45f1f)}
.pill-brand{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--primary-softer);color:#7a3e14}
.input.mono{font-variant-numeric:tabular-nums;letter-spacing:.3px}
.bc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.leader-box{border:1px dashed var(--line2);border-radius:14px;padding:12px 14px;background:#fffdfa}
.leader-box.on{border-style:solid;border-color:var(--primary);background:var(--primary-softer)}
.leader-pick{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.radio-card{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
.radio-card.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-softer)}
.st.emerg{background:#d92d20;color:#fff;border-color:#d92d20;font-weight:800;letter-spacing:.3px}
.emerg-box{border:1.5px dashed #f2b8b5;border-radius:14px;padding:12px 14px;background:#fffafa}
.emerg-box.on{border-style:solid;border-color:#d92d20;background:#fff1f0}
.pr-emerg{display:inline-block;background:#d92d20;color:#fff;font-size:12pt;padding:2px 10px;border-radius:4px;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ac-empty{padding:10px 12px;font-size:12.5px;color:var(--muted)}
.money-wrap{position:relative}
.money-wrap .suffix{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;font-weight:700}
.money-wrap .input{padding-right:54px;font-weight:700}
.ko-box{background:#fffbf7;border-style:dashed}
.tr-status{font-size:11.5px;color:var(--primary-deep);margin-top:5px;min-height:16px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-pill{border:1px solid var(--line2);border-radius:999px;padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center;background:#fff;font-weight:600}
.radio-pill.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-deep)}
.radio-pill input{display:none}
.ent-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;border-radius:16px}
.ent-row.err{box-shadow:0 0 0 3px rgba(194,65,59,.25)}
.ent-card{display:block;border:1.5px solid var(--line2);border-radius:16px;padding:12px 14px;cursor:pointer;background:#fff;transition:all .15s}
.ent-card:hover{border-color:#f0cdb2}
.ent-card.on{border-color:var(--primary);background:var(--primary-softer);box-shadow:0 0 0 3px rgba(245,154,91,.18)}
.ent-card input{display:none}
.ent-id{display:inline-block;font-size:11px;font-weight:800;background:var(--primary-soft);color:var(--primary-deep);border-radius:8px;padding:1px 8px;margin-bottom:4px}
.ent-name{font-weight:800;font-size:13.5px}
.ent-meta{font-size:12px;color:var(--muted);margin-top:2px}
.subcard{border:1px dashed var(--line2);border-radius:16px;padding:16px;background:var(--soft)}
.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{background:var(--primary-softer);text-align:left;padding:9px 8px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line)}
.items-table td{padding:4px;border-bottom:1px solid #f6ede5}
.items-table td .input{padding:7px 9px;border-radius:9px}
.items-table .idx{color:var(--muted);text-align:center;width:34px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.filechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.filechip{display:flex;align-items:center;gap:6px;background:var(--primary-softer);border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:5px 9px;font-size:12px;max-width:100%}
.filechip a{color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.filechip button{border:0;background:transparent;color:inherit;cursor:pointer;font-weight:700}
.dropzone{display:block;border:2px dashed var(--line2);border-radius:16px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#fff;transition:all .15s}
.dropzone:hover,.dropzone.drag{border-color:var(--primary);color:var(--primary-deep);background:var(--primary-softer)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line2);border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;background:#fff;color:var(--ink);white-space:nowrap;font-size:13px;text-decoration:none;transition:all .15s}
.btn:hover{background:var(--primary-softer);border-color:#f0cdb2}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);box-shadow:0 4px 12px rgba(245,154,91,.3)}
.btn.primary:hover{filter:brightness(1.04);box-shadow:0 6px 16px rgba(245,154,91,.38)}
.btn.green{background:#5cb87f;border-color:#5cb87f;color:#fff}
.btn.red{background:#e0675e;border-color:#e0675e;color:#fff}
.btn.amber{background:#f2bd5b;border-color:#f2bd5b;color:#4b2f00}
.btn.violet{background:#9b82d6;border-color:#9b82d6;color:#fff}
.btn.soft{background:var(--primary-soft);border-color:#f7cfb0;color:var(--primary-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--slate-bg)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.btn.lg{padding:12px 24px;font-size:15px;border-radius:14px}
.btn.block{width:100%}
.actions-bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}

/* ---------- stats & filters ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;cursor:pointer;text-align:left;transition:all .15s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2)}
.stat:hover{transform:translateY(-1px)}
.stat.on{border-color:var(--primary);background:var(--primary-softer);box-shadow:0 0 0 3px rgba(245,154,91,.18)}
.stat .n{font-size:24px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.stat.red:before{background:#e8857b}.stat.red .n{color:var(--red)}
.stat.amber:before{background:#f2c46d}.stat.amber .n{color:var(--amber)}
.stat.green:before{background:#7dcb9b}.stat.green .n{color:var(--green)}
.stat.slate:before{background:#c9bcb1}.stat.slate .n{color:var(--slate)}
.stat.violet:before{background:#b6a1e3}.stat.violet .n{color:var(--violet)}
.stat.blue:before{background:#9db8e6}.stat.blue .n{color:var(--blue)}
.stat.all:before{background:var(--primary)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
.filters .input{width:auto;min-width:150px;padding:8px 11px;border-radius:10px}
.filters .grow{flex:1;min-width:200px}
.count-note{font-size:12px;color:var(--muted);margin-left:auto;font-weight:600}

/* ---------- badges ---------- */
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.st.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.st.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.st.green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.st.red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.st.violet{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-line)}
.st.slate{background:var(--slate-bg);color:var(--slate);border-color:var(--slate-line)}
.cat{display:inline-block;padding:2px 9px;border-radius:8px;font-size:11.5px;font-weight:700;background:var(--primary-softer);color:var(--primary-deep);border:1px solid #f7dcc6}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;background:#fff;border:1px solid var(--line2);padding:2px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.code:hover{border-color:var(--primary);color:var(--primary-deep)}

/* ---------- sticky notes ---------- */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.note{position:relative;border-radius:20px;padding:18px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.note:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(91,52,25,.1)}
.note:after{content:'';position:absolute;top:0;left:22px;right:22px;height:4px;border-radius:0 0 6px 6px;background:var(--line2)}
.note.s-amber{background:#fffcf4}.note.s-amber:after{background:#f2c46d}
.note.s-blue{background:#f9fbff}.note.s-blue:after{background:#9db8e6}
.note.s-green{background:#f7fdf9}.note.s-green:after{background:#7dcb9b}
.note.s-red{background:#fffaf9}.note.s-red:after{background:#e8857b}
.note.s-violet{background:#fbf9ff}.note.s-violet:after{background:#b6a1e3}
.note.s-cancel{background:#f5f2ef;color:#8d817a;filter:grayscale(1);opacity:.75}
.note .t{font-weight:800;font-size:15.5px;line-height:1.35}
.note .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px}
.note .feedback,.feedback{background:var(--red-bg);border:1px solid var(--red-line);color:#8e2a24;border-radius:12px;padding:9px 11px;font-size:12.5px}
.feedback b{color:var(--red)}
.note .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line2)}
.deadline{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.deadline.urgent{color:var(--red)}
.deadline.ok{color:var(--green)}
.amount{font-weight:800;font-size:15px}
.amount .krw{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}

/* ---------- approval list ---------- */
.alist{display:flex;flex-direction:column;gap:10px}
.arow{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.arow:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line2)}
.arow.urgent{border-color:var(--red-line)}.arow.urgent:before{background:#e8857b}
.arow.actionable:before{background:var(--primary)}
.arow.done{background:#fbfefc}.arow.done:before{background:#7dcb9b}
.arow.cancel{opacity:.6;background:#f5f2ef;filter:grayscale(1)}
.arow .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px}
.arow .t{font-weight:800;font-size:15px}
.arow .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px}
.arow .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.arow{grid-template-columns:1fr}.arow .btns{justify-content:flex-start}}

/* ---------- data table ---------- */
.dtable{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;background:#fff}
.dtable th{position:sticky;top:0;background:var(--primary-soft);color:#6b3412;text-align:left;padding:10px;font-weight:700;white-space:nowrap;font-size:12px;border-bottom:1px solid #f3cfb2}
.dtable td{padding:9px 10px;border-bottom:1px solid #f6ede5;vertical-align:top}
.dtable tr:hover td{background:var(--soft)}
.dtable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dtable .nowrap{white-space:nowrap}
.dtable tr.group-start td{border-top:2px solid var(--line2)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;max-height:70vh;background:#fff;box-shadow:var(--shadow)}
.sumbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.sumbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 15px;min-width:170px;box-shadow:var(--shadow)}
.sumbox .l{font-size:11.5px;color:var(--muted);font-weight:700}
.sumbox .v{font-size:18px;font-weight:800}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(58,36,20,.42);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:24px;width:100%;max-width:980px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .16s ease-out}
.modal.sm{max-width:500px}
.modal.pv{max-width:1100px}
.rv-btn{border-color:#e9a978;color:#b4521a;background:#fffaf5}
.panel.revise{border:1px dashed #e9a978;background:#fffaf5}
.panel.revise > summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.panel.revise > summary::-webkit-details-marker{display:none}
.panel.revise > summary::after{content:'▾';margin-left:auto;color:var(--primary-deep);font-weight:800}
.panel.revise[open] > summary::after{content:'▴'}
.timeline li.revised > div:not(.when){opacity:.55;text-decoration:line-through}
.rev-tag{display:inline-block;text-decoration:none;font-size:11px;font-weight:700;color:#b4521a;background:var(--primary-soft);border-radius:999px;padding:1px 8px;margin-left:4px}
.kv > div:has(.pv-list){grid-column:1/-1}
.pv-list{display:flex;flex-direction:column;gap:6px;max-width:640px}
.pv-row{display:flex;align-items:center;gap:6px;min-width:0}
.pv-name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--primary-softer);border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);text-align:left}
.pv-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-name:hover{background:var(--primary-soft)}
.pv-btn{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;color:var(--primary-deep);text-decoration:none}
.pv-btn:hover{background:var(--primary-soft)}
.pv-box{min-height:220px;background:var(--soft);border-radius:14px;padding:10px;max-height:calc(100vh - 220px);overflow:auto}
.pv-loading,.pv-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:220px;color:var(--muted);font-weight:600;text-align:center}
.pv-empty{font-size:15px}
.pv-img{display:block;max-width:100%;margin:0 auto;border-radius:8px;background:#fff}
.pv-pages{display:flex;flex-direction:column;gap:10px;max-width:880px;margin:0 auto}
.pv-page{display:block;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(58,36,20,.12)}
.pv-text{white-space:pre-wrap;word-break:break-word;background:#fff;padding:14px;border-radius:8px;margin:0;font-size:13px}
.pv-frame{display:block;width:100%;height:calc(100vh - 260px);min-height:420px;border:0;border-radius:8px;background:#fff}
.modal.pv .pv-box:has(.pv-frame){padding:0;overflow:hidden}
.pv-hint{margin-top:8px;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.modal.pv .modal-b{padding:10px}.pv-box{max-height:calc(100vh - 190px)}}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:linear-gradient(180deg,var(--primary-softer),#fff)}
.modal-h h3{margin:0;font-size:18px;line-height:1.35}
.modal-b{padding:20px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--soft)}
.xbtn{border:0;background:var(--slate-bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;flex:none;color:var(--ink2)}
.xbtn:hover{background:var(--primary-soft)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px;margin-bottom:14px}
.kv .k{font-size:11.5px;color:var(--muted);font-weight:700}
.kv .v{font-weight:600;word-break:break-word}
.section-t{font-size:13.5px;font-weight:800;margin:18px 0 8px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.bil{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.bil{grid-template-columns:1fr}}
.textbox{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 13px;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.textbox .lbl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;white-space:normal}
details.orig{margin-top:6px}
details.orig summary{cursor:pointer;font-size:12px;color:var(--primary-deep);font-weight:600}
details.orig .textbox{margin-top:6px;background:#fff;border-style:dashed}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line2);margin-left:6px}
.timeline li{position:relative;padding:0 0 13px 16px}
.timeline li:before{content:'';position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:#d9c8ba;border:2px solid #fff}
.timeline li.APPROVE:before,.timeline li.SUPPORT_FORWARD:before{background:#5cb87f}
.timeline li.REJECT:before{background:#e0675e}
.timeline li.NEED_INFO:before,.timeline li.SUPPORT_HOLD:before{background:#f2bd5b}
.timeline li.REVIEW:before{background:#9b82d6}
.timeline li.CANCEL:before{background:#b5a99f}
.timeline li.SUBMIT:before,.timeline li.RESUBMIT:before,.timeline li.ADD_DOCS:before{background:var(--primary)}
.timeline .when{font-size:11px;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.panel.approve{border-color:#f7cfb0;background:var(--primary-softer)}
.panel.interp{border-color:var(--violet-line);background:#fcfaff}
.panel.acc{border-color:var(--green-line);background:#f8fdf9}
.notice{padding:11px 13px;border-radius:14px;font-size:13px;margin-bottom:12px}
.notice.red{background:var(--red-bg);color:#8e2a24;border:1px solid var(--red-line)}
.notice.blue{background:var(--blue-bg);color:#24467a;border:1px solid var(--blue-line)}
.notice.amber{background:var(--amber-bg);color:#6b4106;border:1px solid var(--amber-line)}
.notice.violet{background:var(--violet-bg);color:#4d3388;border:1px solid var(--violet-line)}
.notice.orange{background:var(--primary-softer);color:#7a3e14;border:1px solid #f7dcc6}
.interp-note{background:#fff;border:1px solid var(--violet-line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.interp-note .who{font-size:11px;color:var(--violet);font-weight:700;margin-bottom:4px}

/* ---------- toast ---------- */
#toast-root{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:#3a2a21;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.2);font-size:13px;max-width:420px;animation:pop .15s}
.toast.err{background:#b8443c}
.toast.ok{background:#2f7d4f}

/* ---------- notifications ---------- */
.nlist{display:flex;flex-direction:column;gap:8px}
.nitem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;cursor:pointer;display:flex;gap:12px;box-shadow:var(--shadow)}
.nitem:hover{border-color:#f0cdb2}
.nitem.unread{border-left:4px solid var(--primary);background:#fffdfb}
.nitem .ic{width:38px;height:38px;border-radius:12px;background:var(--primary-softer);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.nitem .tt{font-weight:700}
.nitem .ms{font-size:12.5px;color:var(--ink2)}
.nitem .tm{font-size:11px;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;background:var(--slate-bg);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:12px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--primary-deep);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- guide ---------- */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.flow .step{background:var(--primary-softer);border:1px solid #f7dcc6;border-radius:14px;padding:10px 13px;font-weight:700;font-size:13px}
.flow .arr{color:var(--primary-deep);font-weight:800}
.faq{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;background:#fff}
.faq b{display:block;margin-bottom:4px}

/* ---------- admin ---------- */
.admin-wrap{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.admin-wrap{grid-template-columns:1fr}}
.admin-nav{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px;position:sticky;top:130px;box-shadow:var(--shadow)}
@media (max-width:860px){.admin-nav{position:static;display:flex;overflow-x:auto;gap:4px}}
.admin-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink2)}
.admin-nav button:hover{background:var(--primary-softer)}
.admin-nav button.on{background:var(--primary-soft);color:var(--primary-deep)}
.ed-table{width:100%;border-collapse:collapse;font-size:12.5px}
.ed-table th{background:var(--primary-softer);padding:8px;text-align:left;font-size:11.5px;white-space:nowrap;border-bottom:1px solid var(--line);color:var(--ink2)}
.ed-table td{padding:4px;border-bottom:1px solid #f6ede5;vertical-align:top}
.ed-table .input{padding:6px 8px;border-radius:9px;font-size:12.5px;min-width:90px}
.ed-table textarea.input{min-height:60px}
.ed-table td.c{text-align:center}
.savebar{position:sticky;bottom:0;background:rgba(253,248,243,.94);backdrop-filter:blur(4px);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:10px;z-index:5}
.empty{text-align:center;color:var(--muted);padding:44px 16px;background:#fff;border:1px dashed var(--line2);border-radius:var(--radius)}
.empty .big{font-size:36px;margin-bottom:6px}

/* ---------- print ---------- */
#print-area{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff!important}
  #app,#modal-root,#toast-root{display:none!important}
  #print-area{display:block!important}
}
.pr{width:190mm;font-family:'Be Vietnam Pro','Noto Sans KR',Arial,sans-serif;color:#000;font-size:11px;line-height:1.4}
.pr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.pr-co{display:flex;gap:8px;align-items:center}
.pr-co img{max-height:58px;max-width:70px}
.pr-co .n{font-weight:800;font-size:13px}
.pr-title{font-size:17px;font-weight:800;margin:8px 0 2px}
.pr-sign{border-collapse:collapse}
.pr-sign td,.pr-sign th{border:1px solid #000;text-align:center;padding:2px 4px;font-size:9.5px;width:24mm}
.pr-sign th{background:#eee}
.pr-sign td.box{height:15mm;vertical-align:middle}
.pr-stamp{display:inline-block;border:2px solid #b91c1c;color:#b91c1c;border-radius:50%;padding:3px 6px;font-weight:800;font-size:9px;transform:rotate(-8deg)}
.pr table.info{width:100%;border-collapse:collapse;margin-bottom:6px}
.pr table.info td{border:1px solid #000;padding:3px 5px;vertical-align:top}
.pr table.info td.k{background:#f1f1f1;font-weight:700;width:20%;font-size:10px}
.pr .blk{border:1px solid #000;padding:4px 6px;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.pr .blk .h{font-weight:800;font-size:10px;margin-bottom:2px;white-space:normal}
.pr table.items{width:100%;border-collapse:collapse;margin-bottom:6px}
.pr table.items th,.pr table.items td{border:1px solid #000;padding:2px 4px;font-size:10px}
.pr table.items th{background:#eee}
.pr-foot{font-size:9px;color:#444;margin-top:6px;display:flex;justify-content:space-between}

/* =====================================================================
   GIAO DIỆN ĐỒNG BỘ IBVN INTRANET (v3.5) — chỉ ghi đè, không đổi bố cục
   ===================================================================== */
:root{
  --primary:#FF9A5E; --primary-soft:#FFE2D0; --primary-softer:#FFF2E9; --primary-ink:#ffffff; --primary-deep:#C24E18;
  --ig-grad:linear-gradient(135deg,#FFC6A1 0%,#FF9A5E 48%,#F2632C 100%);
  --ig-glow:0 10px 24px -10px rgba(255,110,50,.7);
  --bg:#FFF5EE; --ink:#2A1810; --ink2:#5F473B; --muted:#9C8376; --line:#F6E4D8; --line2:#ECD3C2;
  --radius:22px;
  --shadow:0 1px 2px rgba(140,60,20,.05),0 14px 34px -18px rgba(205,95,35,.28);
}
body{background:radial-gradient(900px 600px at -5% -10%,#FFDCC6 0%,transparent 60%),radial-gradient(760px 520px at 105% 0%,#FFE5EE 0%,transparent 58%),var(--bg);background-attachment:fixed}
h1,h2,h3,.brand-name,.page-head h1,.arow .t,.note .t,.stat .n,.sumbox .v,.modal-h h3{font-family:'Bricolage Grotesque','Be Vietnam Pro','Noto Sans KR',system-ui,sans-serif;letter-spacing:-.01em}
body.lang-ko h1,body.lang-ko h2,body.lang-ko h3{font-family:'Noto Sans KR','Be Vietnam Pro',sans-serif}
.page-head h1{font-size:30px;letter-spacing:-.025em}
.page-head .eyebrow{color:var(--primary-deep);letter-spacing:.12em}
.topbar{background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.9)}
.brand-logo{background:var(--ig-grad);color:#fff;box-shadow:var(--ig-glow)}
.tab{border-radius:14px}
.tab.active{background:var(--ig-grad);color:#fff;border-color:transparent;box-shadow:var(--ig-glow)}
.tab.active .badge{background:rgba(255,255,255,.3)}
.btn{border-radius:12px;transition:transform .12s,box-shadow .15s,filter .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ig-grad);border-color:transparent;color:#fff;box-shadow:var(--ig-glow)}
.btn.primary:hover{filter:saturate(1.15) brightness(1.03);box-shadow:var(--ig-glow)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary-deep)}
.langsw button.on{background:var(--ig-grad);color:#fff}
.card,.arow,.note,.stat,.nitem,.filters,.sumbox,.tbl-wrap{border-radius:var(--radius)}
.card{box-shadow:var(--shadow)}
.card h2 .num{background:var(--ig-grad);color:#fff;box-shadow:var(--ig-glow)}
.arow{transition:transform .15s,box-shadow .15s}
.arow:hover{transform:translateY(-2px);box-shadow:0 18px 40px -22px rgba(205,95,35,.45)}
.arow.actionable:before,.stat.all:before{background:var(--ig-grad)}
.stat.on{box-shadow:0 0 0 4px var(--primary-soft)}
.input:focus{box-shadow:0 0 0 4px var(--primary-soft)}
.radio-pill.on,.radio-card.on,.ent-card.on{border-color:var(--primary);background:var(--primary-softer)}
.avatar{background:var(--ig-grad);color:#fff}
.dtable th{background:var(--primary-softer);color:var(--primary-deep)}
.modal{border-radius:24px}
.modal-h{background:linear-gradient(180deg,var(--primary-softer),#fff)}
.login-card{border-radius:26px}
.sso-card h1{font-size:26px}

/* Khi hiển thị bên trong IBVN Intranet: bỏ logo/đăng xuất trùng lặp, nền trong suốt cho liền mạch */
html.embed body{background:transparent}
html.embed .topbar{top:0;background:rgba(255,255,255,.8)}
html.embed .topbar .brand,html.embed [data-um="logout"],html.embed .announce{display:none!important}
html.embed .top-right{margin-left:0;width:100%}
html.embed .topbar-in{padding-top:10px}
html.embed .main{padding-top:16px}
</style>

</head>
